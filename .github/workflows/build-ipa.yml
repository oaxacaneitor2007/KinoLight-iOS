name: Build IPA (sin firmar)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar el proyecto Xcode
        run: xcodegen generate

      - name: Compilar (sin firma)
        run: |
          xcodebuild \
            -project KinoLight.xcodeproj \
            -scheme KinoLight \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Empaquetar .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/KinoLight.app Payload/
          zip -qr KinoLight-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: KinoLight-unsigned-ipa
          path: KinoLight-unsigned.ipa
