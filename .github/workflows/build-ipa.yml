name: Build IPA (sin firmar)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Localizar el proyecto (project.yml)
        run: |
          FILE=$(find . -name project.yml -not -path './.git/*' | head -n1)
          if [ -z "$FILE" ]; then echo "No se encontró project.yml en el repo"; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$FILE")" >> "$GITHUB_ENV"

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar el proyecto Xcode
        working-directory: ${{ env.PROJECT_DIR }}
        run: xcodegen generate

      - name: Compilar (sin firma)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          xcodebuild \
            -project KinoLight.xcodeproj \
            -scheme KinoLight \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Empaquetar .ipa
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/KinoLight.app Payload/
          zip -qr KinoLight-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: KinoLight-unsigned-ipa
          path: ${{ env.PROJECT_DIR }}/KinoLight-unsigned.ipa
